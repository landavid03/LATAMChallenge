steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["build", "-t", "gcr.io/$PROJECT_ID/user-management-api:$COMMIT_SHA", "."]

  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/user-management-api:$COMMIT_SHA"]

  # Run unit tests
  - name: "gcr.io/$PROJECT_ID/user-management-api:$COMMIT_SHA"
    entrypoint: python
    args: ["-m", "pytest", "-v"]
    env:
      - "DATABASE_URL=sqlite:///./test.db"
      - "LOG_LEVEL=DEBUG"

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "user-management-api"
      - "--image=gcr.io/$PROJECT_ID/user-management-api:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--port=8000"
      - "--set-env-vars=DATABASE_URL=$$DATABASE_URL"
      - "--set-env-vars=LOG_LEVEL=INFO"

# Store built images in Google Container Registry
images:
  - "gcr.io/$PROJECT_ID/user-management-api:$COMMIT_SHA"

# Set required substitution variables
substitutions:
  _DATABASE_URL: "your-database-url-here" # Set this in Cloud Build trigger

# Define secret environment variables
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: "DATABASE_URL"

# Set timeout
timeout: "1800s"
